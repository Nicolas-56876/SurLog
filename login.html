<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal SurLog | Iniciar sesión</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="logo" type="image/png" href="IMG_5082.png">

<style>

.password-box{
    position:relative;
    margin-bottom:20px;
}

.password-box input{
    padding-right:50px;
    margin-bottom:0;
}

.toggle-password{

    position:absolute;

    right:15px;

    top:42%;

    transform:translateY(-42%);

    cursor:pointer;

    font-size:20px;

    color:#6B7280;

    user-select:none;

    transition:.3s;

}

.toggle-password:hover{

    color:#FF6A00;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:#0D1B3D;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

width:420px;

background:white;

padding:45px;

border-radius:15px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

}

.logo{

text-align:center;

margin-bottom:25px;

}

.logo img{

width:250px;

}

h2{

text-align:center;

color:#0D1B3D;

margin-bottom:10px;

font-size:30px;

}

.subtitulo{

text-align:center;

color:#6B7280;

margin-bottom:35px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

color:#0D1B3D;

}

input{

width:100%;

padding:14px;

border-radius:8px;

border:1px solid #ddd;

margin-bottom:20px;

font-size:15px;

transition:.3s;

}

input:focus{

outline:none;

border:1px solid #FF6A00;

}

button{

width:100%;

padding:15px;

background:#FF6A00;

color:white;

font-size:16px;

font-weight:bold;

border:none;

border-radius:8px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#e35d00;

}

.links{

margin-top:25px;

text-align:center;

}

.links a{

display:block;

margin-top:12px;

text-decoration:none;

color:#0D1B3D;

font-weight:600;

}

.links a:hover{

color:#FF6A00;

}

footer{

margin-top:25px;

text-align:center;

font-size:12px;

color:#888;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="gtg.png" alt="SurLog Logistics">

</div>

<h2>Portal de Clientes</h2>

<p class="subtitulo">

Inicia sesión para acceder a tus cotizaciones y servicios.

</p>

<form id="loginForm">

<label>Correo electrónico</label>

<input
type="email"
id="correo"
placeholder="correo@empresa.com"
required>

<label>Contraseña</label>

<div class="password-box">

    <input
    type="password"
    id="password"
    placeholder="********"
    required>

    <span
    class="toggle-password"
    onclick="togglePassword('password', this)">
    👁️
    </span>

</div>

<button type="submit">
  
Iniciar sesión

</button>

</form>

<div class="links">

<a href="recuperar.html">¿Olvidaste tu contraseña?</a>

<a href="registro.html">

Crear una cuenta

</a>

</div>

<footer>

© 2026 SurLog Logistics

</footer>

</div>
<script>

function togglePassword(id, icon){

    const input=document.getElementById(id);

    if(input.type==="password"){

        input.type="text";
        icon.textContent="🙈";

    }else{

        input.type="password";
        icon.textContent="👁️";

    }

}

</script>

<script type="module" src="js/login.js"></script>
</body>

</html>

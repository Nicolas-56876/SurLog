<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recuperar contraseña | SurLog Logistics</title>

<link rel="logo" type="image/png" href="IMG_5082.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:#0D1B3D;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:30px;

}

.card{

width:450px;
max-width:100%;

background:white;

padding:45px;

border-radius:15px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

}

.logo{

text-align:center;
margin-bottom:25px;

}

.logo img{

width:260px;

}

h2{

text-align:center;
color:#0D1B3D;
margin-bottom:10px;

}

.subtitulo{

text-align:center;
color:#6B7280;

line-height:1.6;

margin-bottom:35px;

}

label{

display:block;
margin-bottom:8px;
font-weight:600;

}

input{

width:100%;

padding:14px;

border-radius:8px;

border:1px solid #ddd;

margin-bottom:25px;

font-size:15px;

}

input:focus{

outline:none;

border:1px solid #FF6A00;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:8px;

background:#FF6A00;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#e35d00;

}

.links{

margin-top:25px;

text-align:center;

}

.links a{

display:block;

margin-top:12px;

text-decoration:none;

color:#0D1B3D;

font-weight:600;

}

.links a:hover{

color:#FF6A00;

}

footer{

margin-top:25px;

text-align:center;

font-size:12px;

color:#888;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="gtg.png" alt="SurLog Logistics">

</div>

<h2>¿Olvidaste tu contraseña?</h2>

<p class="subtitulo">

Escribe el correo electrónico con el que registraste tu cuenta.

Te enviaremos un enlace para crear una nueva contraseña.

</p>

<form id="formRecuperacion">
<label>Correo electrónico</label>

<input
type="email"
id="correo"
placeholder="correo@empresa.com"
required>

<button>

Enviar enlace de recuperación

</button>

</form>

<div class="links">

<a href="login.html">

Volver al inicio de sesión

</a>

<a href="registro.html">

Crear una cuenta

</a>

</div>

<footer>

© 2026 SurLog Logistics

</footer>

</div>
<script type="module" src="js/recuperar.js"></script>

</body>

</html>

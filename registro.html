<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SurLog Logistics | Crear cuenta</title>

<link rel="icon" type="image/png" href="IMG_5082.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:#0D1B3D;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:30px;

}

.card{

width:500px;
max-width:100%;

background:white;

padding:45px;

border-radius:15px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

}

.logo{

text-align:center;

margin-bottom:25px;

}

.logo img{

width:260px;

}

h2{

text-align:center;

color:#0D1B3D;

font-size:30px;

margin-bottom:10px;

}

.subtitulo{

text-align:center;

color:#6B7280;

margin-bottom:35px;

line-height:1.6;

}

label{

display:block;

font-weight:600;

margin-bottom:8px;

color:#0D1B3D;

}

input{

width:100%;

padding:14px;

margin-bottom:20px;

border-radius:8px;

border:1px solid #ddd;

font-size:15px;

transition:.3s;

}

input:focus{

outline:none;

border:1px solid #FF6A00;

}

button{

width:100%;

padding:15px;

background:#FF6A00;

color:white;

font-size:16px;

font-weight:bold;

border:none;

border-radius:8px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#e35d00;

}

.login{

text-align:center;

margin-top:25px;

}

.login a{

text-decoration:none;

font-weight:600;

color:#0D1B3D;

}

.login a:hover{

color:#FF6A00;

}

footer{

margin-top:25px;

text-align:center;

font-size:12px;

color:#888;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="gtg.png" alt="SurLog Logistics">

</div>

<h2>Crear cuenta</h2>

<p class="subtitulo">

Regístrate para administrar tus cotizaciones, servicios y seguimiento de envíos.

</p>

<form>

<label>Nombre completo</label>

<input
type="text"
placeholder="Ej. Juan Pérez"
required>

<label>Correo electrónico</label>

<input
type="email"
placeholder="correo@empresa.com"
required>

<label>Teléfono</label>

<input
type="tel"
placeholder="+52 999 999 9999"
required>

<label>Contraseña</label>

<input
type="password"
placeholder="Mínimo 8 caracteres"
required>

<label>Confirmar contraseña</label>

<input
type="password"
placeholder="Repite tu contraseña"
required>

<button>

Crear cuenta

</button>

</form>

<div class="login">

¿Ya tienes cuenta?

<a href="login.html">

Inicia sesión

</a>

</div>

<footer>

© 2026 SurLog Logistics

</footer>

</div>

</body>
<script type="module" src="js/registro.js"></script>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SurLog Logistics | Crear cuenta</title>

<link rel="icon" type="image/png" href="IMG_5082.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{

background:#0D1B3D;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:30px;

}

.card{

width:500px;
max-width:100%;

background:white;

padding:45px;

border-radius:15px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

}

.logo{

text-align:center;

margin-bottom:25px;

}

.logo img{

width:260px;

}

h2{

text-align:center;

color:#0D1B3D;

font-size:30px;

margin-bottom:10px;

}

.subtitulo{

text-align:center;

color:#6B7280;

margin-bottom:35px;

line-height:1.6;

}

label{

display:block;

font-weight:600;

margin-bottom:8px;

color:#0D1B3D;

}

input{

width:100%;

padding:14px;

margin-bottom:20px;

border-radius:8px;

border:1px solid #ddd;

font-size:15px;

transition:.3s;

}

input:focus{

outline:none;

border:1px solid #FF6A00;

}

button{

width:100%;

padding:15px;

background:#FF6A00;

color:white;

font-size:16px;

font-weight:bold;

border:none;

border-radius:8px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#e35d00;

}

.login{

text-align:center;

margin-top:25px;

}

.login a{

text-decoration:none;

font-weight:600;

color:#0D1B3D;

}

.login a:hover{

color:#FF6A00;

}

footer{

margin-top:25px;

text-align:center;

font-size:12px;

color:#888;
}
.password-box{
    position: relative;
    margin-bottom: 20px;
}

.password-box input{
    padding-right:50px;
    margin-bottom:0;
}

.toggle-password{

    position:absolute;

    right:15px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    font-size:20px;

    user-select:none;

    color:#6B7280;

    transition:.3s;

}

.toggle-password:hover{

    color:#FF6A00;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="gtg.png" alt="SurLog Logistics">

</div>

<h2>Crear cuenta</h2>

<p class="subtitulo">

Regístrate para administrar tus cotizaciones, servicios y seguimiento de envíos.

</p>

<form id="registroForm">

<label>Nombre completo</label>

<input
type="text"
id="nombre"
placeholder="Ej. Juan Pérez"
required>

<label>Correo electrónico</label>

<input
type="email"
id="correo"
placeholder="correo@empresa.com"
required>

<label>Teléfono</label>

<input
type="tel"
id="telefono"
placeholder="+52 999 999 9999"
required>

<label>Contraseña</label>

<div class="password-box">
    <input
        type="password"
        id="password"
        placeholder="Mínimo 8 caracteres"
        required>

    <span class="toggle-password" onclick="togglePassword('password', this)">
        👁️
    </span>
</div>

<label>Confirmar contraseña</label>

<div class="password-box">
    <input
        type="password"
        id="confirmarPassword"
        placeholder="Repite tu contraseña"
        required>

    <span class="toggle-password" onclick="togglePassword('confirmarPassword', this)">
        👁️
    </span>
</div>

<button type="submit">
Crear cuenta
</button>

</form>

<div class="login">

¿Ya tienes cuenta?

<a href="login.html">

Inicia sesión

</a>

</div>

<footer>

© 2026 SurLog Logistics

</footer>

</div><script>

function togglePassword(id, icon){

    const input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        icon.textContent = "🙈";

    }else{

        input.type = "password";
        icon.textContent = "👁️";

    }

}

</script>

<script type="module" src="js/registro.js"></script>
</body>
</html>
